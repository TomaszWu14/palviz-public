name: E2E nightly

# US-018 (#29), D-12: nocne testy przepływów E2E (@flow, tests/e2e/flow.spec.ts) na `main`.
# Przepływy sprawdzają DOM i tekst (bez zrzutów ekranu), więc działają na runnerze Linux.
# Testy wizualne (toHaveScreenshot) zostają lokalne — wzorce robione są na Windows.
# Wynik: zakładka Actions; przy porażce raport HTML i ślady Playwrighta jako artefakt.
on:
  schedule:
    - cron: '17 1 * * *'   # 01:17 UTC codziennie (poza pełną godziną — mniejsze kolejki)
  workflow_dispatch:
  # Zmiana samych testów E2E albo tego workflow — sprawdź ją na PR, zanim trafi do nocnego biegu.
  pull_request:
    branches: [main]
    paths: ['.github/workflows/e2e-nightly.yml', 'tests/e2e/**']

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  flow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      # Biblioteki front-end są vendorowane (ADR-0005) i nie leżą w repo — jak w Dockerfile.
      - name: Fetch vendored front-end libraries
        working-directory: web
        run: sh scripts/fetch_vendor.sh

      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run E2E flows (@flow)
        working-directory: tests/e2e
        env:
          CI: 'true'
          PYTHON: python
        run: npx playwright test --project flow

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 14
