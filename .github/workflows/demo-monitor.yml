name: Monitor demo

# Co 6 godzin sprawdza publiczne demo (https://logviz.twapp.pl): /health/ musi zwrócić 200,
# a strona główna (po przekierowaniu na logowanie) i ekran logowania 200 albo 401 z bramką
# portfolio (ForwardAuth, od 24.10).
# Awaria → jedno otwarte issue „Demo nie odpowiada” (etykieta `demo`, kolejne awarie
# dopisują komentarz); pierwszy udany przebieg po awarii zamyka je. GITHUB_TOKEN + opcjonalny sekret NTFY_URL (push ntfy).
on:
  schedule:
    - cron: '17 */6 * * *'   # co 6 h, poza pełną godziną (mniej opóźnień w GitHub)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: demo-monitor
  cancel-in-progress: false

env:
  DEMO_URL: https://logviz.twapp.pl
  LABEL: demo

jobs:
  check:
    name: Demo odpowiada
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sprawdź demo
        id: check
        shell: bash
        run: |
          set -uo pipefail
          problems=()
          # -L: „/” bez sesji przekierowuje na /login/?next=/ — liczy się kod końcowy (treść → page.html).
          code() { rm -f page.html; curl -sS -L -o page.html -w '%{http_code}' --max-time 30 \
                     --retry 3 --retry-delay 10 --retry-all-errors "$1" 2>/dev/null || echo 000; }
          # Od 24.10 demo stoi za ForwardAuth portfolio: bez ciasteczka `gosc` strony dają 401
          # z formularzem bramki (link do portfolio.twapp.pl/wejscie) — to znaczy, że bramka działa.
          # Dowodem życia aplikacji jest wtedy /health/ (ForwardAuth go przepuszcza), który MUSI dać 200.
          bramka() { [ "$1" = 401 ] && grep -qF 'portfolio.twapp.pl/wejscie' page.html 2>/dev/null; }
          za_bramka=''
          for path in / /login/ /health/; do
            c=$(code "$DEMO_URL$path")
            echo "$path → $c"
            if [ "$c" = 200 ]; then
              :
            elif [ "$path" != /health/ ] && bramka "$c"; then
              za_bramka=1
            elif [ "$path" = /health/ ]; then
              problems+=("\`$path\` zwraca HTTP $c (oczekiwane 200)")
            else
              problems+=("\`$path\` zwraca HTTP $c (oczekiwane 200 albo 401 z bramką portfolio)")
            fi
          done
          note=''
          [ -n "$za_bramka" ] && note=' Za bramką portfolio – sprawdzono tylko zdrowie.'

          if [ ${#problems[@]} -eq 0 ]; then
            echo "Demo $DEMO_URL odpowiada (/health/ → 200; /, /login/ → 200 albo 401 bramki portfolio).$note" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            {
              echo "Demo $DEMO_URL nie odpowiada poprawnie ($(date -u '+%Y-%m-%d %H:%M UTC')):"
              for p in "${problems[@]}"; do echo "- $p"; done
              [ -z "$note" ] || echo "-$note"
              echo
              echo "Przebieg: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            } > report.md
            tee -a "$GITHUB_STEP_SUMMARY" < report.md
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Zgłoś awarię (issue)
        if: steps.check.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          # push ntfy (opcjonalny: bez sekretu NTFY_URL pomijamy; nigdy nie psuje przebiegu)
          ntfy() {
            case "${NTFY_URL:-}" in https://*) ;; *) echo "NTFY_URL nie ustawiony lub nie https — pomijam push"; return 0;; esac
            curl -fsS --max-time 10 -H "Title: $1" -H "Priority: $2" -H "Tags: $3" -d "$4" "$NTFY_URL" || true
          }
          gh label create "$LABEL" --color B60205 --description "Automatyczny monitor demo" 2>/dev/null || true
          open=$(gh issue list --label "$LABEL" --state open --search 'in:title "Demo nie odpowiada"' \
                   --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file report.md
          else
            gh issue create --title "Demo nie odpowiada" --label "$LABEL" --body-file report.md
            ntfy "Demo nie odpowiada: palviz-public" high warning "Demo przestało odpowiadać. Szczegóły: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          exit 1   # czerwony przebieg = mail z GitHub do właściciela repozytorium

      - name: Zamknij zgłoszenie po naprawie
        if: steps.check.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          # push ntfy (opcjonalny: bez sekretu NTFY_URL pomijamy; nigdy nie psuje przebiegu)
          ntfy() {
            case "${NTFY_URL:-}" in https://*) ;; *) echo "NTFY_URL nie ustawiony lub nie https — pomijam push"; return 0;; esac
            curl -fsS --max-time 10 -H "Title: $1" -H "Priority: $2" -H "Tags: $3" -d "$4" "$NTFY_URL" || true
          }
          for n in $(gh issue list --label "$LABEL" --state open --search 'in:title "Demo nie odpowiada"' \
                       --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Demo znów odpowiada ($(date -u '+%Y-%m-%d %H:%M UTC'))."
            recovered=1
          done
          if [ -n "${recovered:-}" ]; then
            ntfy "Demo znowu odpowiada: palviz-public" low white_check_mark "Demo znowu odpowiada. Przebieg: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
