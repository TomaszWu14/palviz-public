name: Security

# Skanery bezpieczeństwa (ADR-0019 — Przyjęta 2026-10-16, wariant A; audyt 2026-10-15 S-01/S-09):
#   • gitleaks   — sekrety w historii i diffie: BLOKUJE (PR, push, tygodniowo)
#   • Bandit     — SAST Python: BLOKUJE przy HIGH severity + HIGH confidence (ten sam próg co
#                  pre-commit); pełny raport informacyjnie w podsumowaniu joba
#   • pip-audit  — CVE zależności Pythona: informacyjnie (podsumowanie joba)
#   • Trivy fs   — CVE + misconfig (Dockerfile/compose) + sekrety: informacyjnie na PR
#   • npm audit  — CVE bibliotek front-end (web/package-lock.json): informacyjnie
#   • Trivy image — tygodniowo/ręcznie: build obrazu z Dockerfile i skan; CRITICAL/HIGH z poprawką
#                  czerwieni przebieg
# Wymaganym checkiem na main pozostaje `test` (ci.yml, ADR-0009); `Security` nie jest wymagany
# (ADR-0019 wariant A — zmiana = nowy ADR). SARIF trafia do zakładki Security ▸ Code scanning
# (continue-on-error, gdyby code scanning był wyłączony). Uruchomienie lokalne: CONTRIBUTING.md §6.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"    # co tydzień, poniedziałek 05:00 UTC
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Sekrety — blokuje ────────────────────────────────────────────────────────
  gitleaks:
    name: gitleaks (sekrety, blokuje)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read     # gitleaks-action listuje commity PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0        # pełna historia, nie tylko czubek
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action jest darmowy dla repo na koncie osobistym; GITLEAKS_LICENSE
          # potrzebny tylko dla organizacji.

  # ── SAST Python — HIGH/HIGH blokuje, reszta informacyjnie ──────────────────
  bandit-gate:
    name: Bandit (HIGH/HIGH blokuje)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install Bandit
        run: pip install "bandit[toml,sarif]==1.9.4"
      - name: Bandit — bramka (HIGH severity + HIGH confidence)
        # Ten sam próg co hook pre-commit (.pre-commit-config.yaml). Konfiguracja: pyproject [tool.bandit]
        # (bez tests/migrations/vendor, B101 pominięte). Fałszywy alarm = `# nosec Bxxx` z uzasadnieniem.
        run: bandit -c pyproject.toml -r web palletizer --severity-level high --confidence-level high -q
      - name: Bandit — pełny raport (informacyjnie)
        continue-on-error: true
        run: |
          bandit -c pyproject.toml -r web palletizer -q -f txt -o bandit.txt || true
          {
            echo "### Bandit — pełny raport (informacyjnie; bramka = HIGH/HIGH wyżej)"
            echo '```'
            tail -n 40 bandit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Bandit — SARIF
        continue-on-error: true
        run: bandit -c pyproject.toml -r web palletizer -f sarif -o bandit.sarif || true
      - name: Upload Bandit SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        continue-on-error: true
        with:
          sarif_file: bandit.sarif
          category: bandit

  # ── Trivy fs: CVE + misconfig + sekrety — informacyjnie ─────────────────────
  trivy:
    name: Trivy (fs, informacyjnie)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Trivy — tabela (nie blokuje)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          format: table
          exit-code: "0"          # informacyjnie — pokazuje, nie blokuje
          ignore-unfixed: true
          skip-dirs: web/ui/static/ui/vendor

      - name: Trivy — SARIF (code scanning)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          skip-dirs: web/ui/static/ui/vendor

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

  # ── Python: CVE zależności — informacyjnie ──────────────────────────────────
  python-audit:
    name: pip-audit (informacyjnie)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: pip-audit (CVE zależności runtime)
        continue-on-error: true   # informacyjnie (ADR-0019 wariant A, przyjęty); blokada = wariant B (nowy ADR)
        run: |
          set -o pipefail
          pip-audit -r requirements.txt --desc 2>&1 | tee pip-audit.txt
      - name: Podsumowanie
        if: always()
        run: |
          {
            echo "### pip-audit — requirements.txt (informacyjnie)"
            echo '```'
            tail -n 40 pip-audit.txt 2>/dev/null || echo "brak wyniku"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Front-end: CVE zależności — informacyjnie ───────────────────────────────
  npm-audit:
    name: npm audit (frontend, informacyjnie)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps (from lockfile)
        run: npm ci --ignore-scripts

      - name: npm audit
        continue-on-error: true   # informacyjnie
        run: |
          set -o pipefail
          npm audit --audit-level=high 2>&1 | tee npm-audit.txt
      - name: Podsumowanie
        if: always()
        run: |
          {
            echo "### npm audit — web/package-lock.json (informacyjnie)"
            echo '```'
            tail -n 30 npm-audit.txt 2>/dev/null || echo "brak wyniku"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Obraz Dockera: build + skan — tygodniowo / ręcznie ──────────────────────
  # Nie na PR (build ~5 min i pobieranie bibliotek JS z CDN) — ADR-0009/0019.
  image-scan:
    name: Trivy (obraz Dockera, tygodniowo)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build image (Dockerfile jak w Coolify, bez cache)
        run: docker build --build-arg SOURCE_COMMIT="${GITHUB_SHA}" -t palviz:ci .
      - name: Trivy — obraz (CRITICAL/HIGH z poprawką blokuje)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: palviz:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Trivy — obraz SARIF
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: palviz:ci
          format: sarif
          output: trivy-image.sarif
          ignore-unfixed: true
      - name: Upload Trivy image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        continue-on-error: true
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
