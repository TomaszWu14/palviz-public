name: Security

# Skanery bezpieczeństwa (ADR-0019 wariant A + ADR-0022 „wspólna podstawa”; audyt 2026-10-15 S-01/S-09):
#   • gitleaks   — sekrety w historii i diffie: BLOKUJE (PR, push, tygodniowo); binarka
#                  z przypiętą wersją i sumą sha256 (ADR-0022)
#   • Bandit     — SAST Python: BLOKUJE od MEDIUM severity + MEDIUM confidence (ADR-0022; pre-commit
#                  lokalnie zostaje na HIGH/HIGH); pełny raport informacyjnie w podsumowaniu joba
#   • Semgrep    — p/owasp-top-ten: na PR BLOKUJE nowe znaleziska (względem bazy PR-a); pełny skan
#                  repo informacyjnie (push/tygodniowo) — zaległe znaleziska do triage (ADR-0022)
#   • pip-audit  — CVE zależności Pythona: informacyjnie (podsumowanie joba)
#   • Trivy fs   — CVE + misconfig (Dockerfile/compose) + sekrety: HIGH/CRITICAL z dostępną poprawką
#                  BLOKUJE (ADR-0022); wyjątki w .trivyignore (ID + uzasadnienie)
#   • npm audit  — CVE bibliotek front-end (web/package-lock.json): informacyjnie
#   • Trivy image — tygodniowo/ręcznie: build obrazu z Dockerfile i skan; CRITICAL/HIGH z poprawką
#                  czerwieni przebieg
# Wymaganym checkiem na main pozostaje `test` (ci.yml, ADR-0009); `Security` nie jest wymagany
# (ADR-0019 wariant A; ADR-0022 zaostrza progi, nie zmienia ochrony gałęzi). SARIF trafia do zakładki Security ▸ Code scanning
# (continue-on-error, gdyby code scanning był wyłączony). Uruchomienie lokalne: CONTRIBUTING.md §6.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"    # co tydzień, poniedziałek 05:00 UTC
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Sekrety — blokuje ────────────────────────────────────────────────────────
  gitleaks:
    name: gitleaks (sekrety, blokuje)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Przypięta binarka + sha256 (ADR-0022) zamiast gitleaks-action, które bez GITLEAKS_VERSION
      # pobiera „latest” bez weryfikacji sumy.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0        # pełna historia, nie tylko czubek
      - name: Instalacja gitleaks (przypięta wersja + sha256)
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: gitleaks
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # .gitleaks.toml (allowlista szablonów) i .gitleaksignore (fingerprinty) czytane z repo.
          args=(git --redact --no-banner)
          # PR: tylko jego commity; push/tygodniowo/ręcznie: cała historia.
          if [ -n "$BASE" ]; then args+=(--log-opts="$BASE..$HEAD"); fi
          "$RUNNER_TEMP/gitleaks" "${args[@]}" .

  # ── SAST Python — MEDIUM+/MEDIUM+ blokuje, reszta informacyjnie ────────────
  bandit-gate:
    name: Bandit (MEDIUM+ blokuje)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install Bandit
        run: pip install "bandit[toml,sarif]==1.9.4"
      - name: Bandit — bramka (MEDIUM+ severity + MEDIUM+ confidence)
        # ADR-0022 (wcześniej HIGH/HIGH jak pre-commit). Konfiguracja: pyproject [tool.bandit]
        # (bez tests/migrations/vendor, B101 pominięte). Fałszywy alarm = `# nosec Bxxx` z uzasadnieniem.
        run: bandit -c pyproject.toml -r web palletizer --severity-level medium --confidence-level medium -q
      - name: Bandit — pełny raport (informacyjnie)
        continue-on-error: true
        run: |
          bandit -c pyproject.toml -r web palletizer -q -f txt -o bandit.txt || true
          {
            echo "### Bandit — pełny raport (informacyjnie; bramka = MEDIUM+/MEDIUM+ wyżej)"
            echo '```'
            tail -n 40 bandit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Bandit — SARIF
        continue-on-error: true
        run: bandit -c pyproject.toml -r web palletizer -f sarif -o bandit.sarif || true
      - name: Upload Bandit SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        continue-on-error: true
        with:
          sarif_file: bandit.sarif
          category: bandit

  # ── SAST OWASP Top 10 — nowe znaleziska na PR blokują ───────────────────────
  semgrep:
    name: Semgrep (OWASP, nowe znaleziska blokują)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0        # --baseline-commit potrzebuje bazy PR-a w historii
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install "semgrep==1.181.0"
      - name: Semgrep p/owasp-top-ten
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        # PR: bramka tylko na znaleziskach WPROWADZONYCH przez PR (--baseline-commit) — zaległe
        # (~150, głównie szablony Django) czekają na triage (ADR-0022). Push/tygodniowo: pełny skan,
        # informacyjnie. Fałszywy alarm: `# nosemgrep: <id-reguły>` + powód w komentarzu.
        run: |
          args=(scan --config p/owasp-top-ten --metrics off --text --sarif-output semgrep.sarif
                --exclude tests --exclude testkit --exclude migrations --exclude vendor --exclude '*.min.js')
          if [ -n "$BASE" ]; then
            semgrep "${args[@]}" --error --baseline-commit "$BASE" web palletizer
          else
            semgrep "${args[@]}" web palletizer || true
          fi
      - name: Artefakt Semgrep
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-${{ github.sha }}
          path: semgrep.sarif
          if-no-files-found: warn
          retention-days: 30

  # ── Trivy fs: CVE + misconfig + sekrety — HIGH/CRITICAL z poprawką blokuje ──
  trivy:
    name: Trivy (fs, HIGH/CRITICAL z poprawką blokuje)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Trivy — bramka (HIGH/CRITICAL z dostępną poprawką)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          format: table
          exit-code: "1"          # ADR-0022: blokuje (wcześniej informacyjnie)
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          skip-dirs: web/ui/static/ui/vendor

      - name: Trivy — SARIF (code scanning)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          skip-dirs: web/ui/static/ui/vendor

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

  # ── Python: CVE zależności — informacyjnie ──────────────────────────────────
  python-audit:
    name: pip-audit (informacyjnie)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: pip-audit (CVE zależności runtime)
        continue-on-error: true   # informacyjnie (ADR-0019 wariant A, przyjęty); blokada = wariant B (nowy ADR)
        run: |
          set -o pipefail
          pip-audit -r requirements.txt --desc 2>&1 | tee pip-audit.txt
      - name: Podsumowanie
        if: always()
        run: |
          {
            echo "### pip-audit — requirements.txt (informacyjnie)"
            echo '```'
            tail -n 40 pip-audit.txt 2>/dev/null || echo "brak wyniku"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Front-end: CVE zależności — informacyjnie ───────────────────────────────
  npm-audit:
    name: npm audit (frontend, informacyjnie)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps (from lockfile)
        run: npm ci --ignore-scripts

      - name: npm audit
        continue-on-error: true   # informacyjnie
        run: |
          set -o pipefail
          npm audit --audit-level=high 2>&1 | tee npm-audit.txt
      - name: Podsumowanie
        if: always()
        run: |
          {
            echo "### npm audit — web/package-lock.json (informacyjnie)"
            echo '```'
            tail -n 30 npm-audit.txt 2>/dev/null || echo "brak wyniku"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: npm audit — tests/e2e (Playwright, informacyjnie)
        continue-on-error: true   # informacyjnie; audyt czyta sam lockfile, bez instalacji
        working-directory: tests/e2e
        run: npm audit --audit-level=high

  # ── Obraz Dockera: build + skan — tygodniowo / ręcznie ──────────────────────
  # Nie na PR (build ~5 min i pobieranie bibliotek JS z CDN) — ADR-0009/0019.
  image-scan:
    name: Trivy (obraz Dockera, tygodniowo)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build image (Dockerfile jak w Coolify, bez cache)
        run: docker build --build-arg SOURCE_COMMIT="${GITHUB_SHA}" -t palviz:ci .
      - name: Trivy — obraz (CRITICAL/HIGH z poprawką blokuje)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: palviz:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Trivy — obraz SARIF
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: palviz:ci
          format: sarif
          output: trivy-image.sarif
          ignore-unfixed: true
      - name: Upload Trivy image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        continue-on-error: true
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
